services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: builder
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - ./backend:/app:z
      - /app/node_modules
    command: sh -c "npx wait-on tcp:db:5432 && npx prisma db push && npx prisma db seed && npm run start:dev"
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      target: builder
      args:
        API_URL: ${API_URL}
        MAPTILER_API_KEY: ${MAPTILER_API_KEY}
        MAPTILER_MAP_ID: ${MAPTILER_MAP_ID}
    restart: always
    environment:
      API_URL: ${API_URL}
      MAPTILER_API_KEY: ${MAPTILER_API_KEY}
      MAPTILER_MAP_ID: ${MAPTILER_MAP_ID}
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - backend
    env_file:
      - .env

volumes:
  postgres_data:

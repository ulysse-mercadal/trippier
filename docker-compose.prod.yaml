# Trippier — production stack (VPS): pulls SHA-pinned images from GHCR.
# The deploy pipeline sets IMAGE_TAG to the built commit and runs `up -d --wait`.
#
#   make prod-pull && make prod-up
#
# Requires OWNER, IMAGE_TAG and the app secrets in .env on the host.

name: trippier

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:15-alpine
    <<: *defaults
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/${OWNER:-ulysse-mercadal}/trippier-backend:${IMAGE_TAG:-latest}
    <<: *defaults
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/${OWNER:-ulysse-mercadal}/trippier-frontend:${IMAGE_TAG:-latest}
    <<: *defaults
    env_file: .env
    environment:
      API_URL: ${API_URL}
    ports:
      - "80:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:

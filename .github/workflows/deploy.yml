name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          MAPTILER_MAP_ID: ${{ secrets.MAPTILER_MAP_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: MAPTILER_API_KEY,MAPTILER_MAP_ID
          script: |
            cd ~/trippier
            git fetch origin main
            git reset --hard origin/main
            export MAPTILER_API_KEY=$MAPTILER_API_KEY
            export MAPTILER_MAP_ID=$MAPTILER_MAP_ID
            sudo -E docker compose -f docker-compose.prod.yaml up -d --build --force-recreate
            sudo docker image prune -f
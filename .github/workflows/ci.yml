name: CI - Test & Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      # Robustly detects changed paths for the whole PR (vs base) or push (vs
      # before), instead of only diffing the last commit.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            mobile:
              - 'mobile/**'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: trippier_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: ./backend
        run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        working-directory: ./backend
        run: bunx prisma generate
      - name: Run Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/trippier_db?schema=public
        run: bunx prisma db push
      - name: Seed Database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/trippier_db?schema=public
        run: bunx prisma db seed
      - name: Lint
        working-directory: ./backend
        run: bun run lint
      - name: Build
        working-directory: ./backend
        run: bun run build
      - name: Start Backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/trippier_db?schema=public
          JWT_SECRET: super-secret-test-key
          PORT: 3001
        run: |
          bun run start:prod &
          bunx wait-on http://localhost:3001
      - name: Run Tests (Postman)
        working-directory: ./backend
        run: bun run test:e2e:all

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: ./frontend
        run: bun run lint
      - name: Build
        working-directory: ./frontend
        run: bun run build
        env:
          API_URL: http://localhost:3001

  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: ./mobile
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: ./mobile
        run: bun run lint
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Create .env file
        run: |
          echo "API_URL=${{ secrets.API_URL }}" >> .env
      - name: Build Android
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease